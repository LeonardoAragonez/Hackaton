# Proyecto monorepo en SonarCloud (mismo key que AutoScan "Hackaton")
sonar.organization=leonardoaragonez
sonar.projectKey=LeonardoAragonez_Hackaton
sonar.projectName=Hackaton

sonar.sources=tractor-store-backend/src/main/java,tractor-store-frontend/apps,tractor-store-frontend/packages
sonar.tests=tractor-store-backend/src/test/java,tractor-store-frontend/apps,tractor-store-frontend/packages,tractor-store-frontend/e2e
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts,**/e2e/**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.nx/**,**/*.spec.ts,tractor-store-frontend/**/mocks/**,**/.github/**

sonar.java.source=21
sonar.java.binaries=tractor-store-backend/target/classes
sonar.java.test.binaries=tractor-store-backend/target/test-classes
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=tractor-store-backend/target/site/jacoco/jacoco.xml

# Rutas al repo; en CI se prefija SF: en lcov (workflow sonar-hackaton)
sonar.typescript.lcov.reportPaths=tractor-store-frontend/coverage/packages/shared-catalog/lcov.info,tractor-store-frontend/coverage/packages/ts-design-system/lcov.info
sonar.javascript.lcov.reportPaths=tractor-store-frontend/coverage/packages/shared-catalog/lcov.info,tractor-store-frontend/coverage/packages/ts-design-system/lcov.info

sonar.sourceEncoding=UTF-8
