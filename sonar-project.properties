# Monorepo Hackaton — un proyecto Sonar, dos módulos (rutas lcov/jacoco relativas a cada carpeta)
sonar.organization=leonardoaragonez
sonar.projectKey=LeonardoAragonez_Hackaton
sonar.projectName=Hackaton
sonar.sourceEncoding=UTF-8

sonar.modules=backend,frontend

backend.sonar.projectBaseDir=tractor-store-backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.source=21
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.java.coveragePlugin=jacoco
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
backend.sonar.exclusions=**/package-info.java

frontend.sonar.projectBaseDir=tractor-store-frontend
frontend.sonar.sources=apps,packages
frontend.sonar.tests=apps,packages,e2e
frontend.sonar.test.inclusions=**/*.spec.ts,**/e2e/**/*.spec.ts
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/*.spec.ts,**/mocks/**
frontend.sonar.typescript.lcov.reportPaths=coverage/packages/shared-catalog/lcov.info,coverage/packages/ts-design-system/lcov.info
frontend.sonar.javascript.lcov.reportPaths=coverage/packages/shared-catalog/lcov.info,coverage/packages/ts-design-system/lcov.info
