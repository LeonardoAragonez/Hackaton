# Monorepo Hackaton — análisis desde la raíz; lcov con rutas SF:tractor-store-frontend/... (ver CI)
sonar.organization=leonardoaragonez
sonar.projectKey=LeonardoAragonez_Hackaton
sonar.projectName=Hackaton
sonar.sourceEncoding=UTF-8

sonar.sources=tractor-store-backend/src/main/java,tractor-store-frontend/apps,tractor-store-frontend/packages
sonar.tests=tractor-store-backend/src/test/java,tractor-store-frontend/apps,tractor-store-frontend/packages
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.nx/**,**/*.spec.ts,tractor-store-frontend/**/mocks/**,**/.github/**,**/test-setup.ts,**/jest.config.*,**/jest.preset.*,tractor-store-frontend/tools/**,tractor-store-frontend/scripts/**,**/eslint.config.*,**/postcss.config.*,**/tailwind.config.*,**/webpack.config.*,**/webpack-aliases.*

sonar.java.source=21
sonar.java.binaries=tractor-store-backend/target/classes
sonar.java.test.binaries=tractor-store-backend/target/test-classes
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=tractor-store-backend/target/site/jacoco/jacoco.xml

sonar.typescript.lcov.reportPaths=tractor-store-frontend/coverage/lcov.sonar.info
sonar.javascript.lcov.reportPaths=tractor-store-frontend/coverage/lcov.sonar.info

# Cobertura solo sobre lógica testeable (UI JPA/DTO/bootstrap sin % artificialmente bajo)
sonar.coverage.exclusions=\
  **/*Application.java,\
  **/package-info.java,\
  **/persistence/**,\
  **/seed/**,\
  **/*Dtos.java,\
  **/OpenApiConfig.java,\
  **/WebConfig.java,\
  tractor-store-frontend/apps/**,\
  tractor-store-frontend/packages/mfe-*/src/**/pages/**,\
  tractor-store-frontend/packages/mfe-*/src/**/components/**,\
  tractor-store-frontend/packages/mfe-*/src/**/data/**,\
  tractor-store-frontend/packages/mfe-*/src/**/remote-entry/**,\
  tractor-store-frontend/packages/mfe-*/src/**/app.component.ts,\
  tractor-store-frontend/packages/mfe-*/src/**/app.config.ts,\
  tractor-store-frontend/packages/mfe-*/src/main.ts,\
  tractor-store-frontend/**/webpack.config.js,\
  tractor-store-frontend/**/mocks/**,\
  tractor-store-frontend/packages/shared-catalog/src/lib/remote-entry.providers.ts,\
  tractor-store-frontend/packages/shared-catalog/src/lib/msw/**,\
  tractor-store-frontend/packages/shared-catalog/src/lib/ux/confetti.util.ts,\
  tractor-store-frontend/packages/shared-catalog/src/lib/ux/toast.service.ts,\
  **/test-setup.ts,\
  **/jest.config.*,\
  **/jest.preset.*,\
  tractor-store-frontend/tools/**,\
  tractor-store-frontend/scripts/**,\
  **/eslint.config.*,\
  **/postcss.config.*,\
  **/tailwind.config.*,\
  **/webpack-aliases.*

# Evitar falsas duplicaciones por suites espejo entre los 3 MFEs (decide/explore/checkout)
# y por configs idénticas (jest.config.js, test-setup.ts).
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/test-setup.ts,\
  **/jest.config.*,\
  tractor-store-frontend/tools/**
