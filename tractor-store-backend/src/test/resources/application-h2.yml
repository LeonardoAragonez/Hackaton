spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:tractor_store;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

tractor:
  cart:
    cookie-name: CART_SESSION
    cookie-max-age-days: 30
    cookie-path: /
  cors:
    allowed-origins:
      - http://localhost:4200
