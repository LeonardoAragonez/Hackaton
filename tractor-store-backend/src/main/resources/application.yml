spring:
  application:
    name: tractor-store-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

tractor:
  cart:
    cookie-name: CART_SESSION
    cookie-max-age-days: 30
    cookie-path: /
  cors:
    allowed-origins:
      - http://localhost:4200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/tractor_store
    username: tractor
    password: tractor
  jpa:
    show-sql: false

logging:
  level:
    com.quind.tractorstore: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/tractor_store}
    username: ${DATABASE_USERNAME:tractor}
    password: ${DATABASE_PASSWORD:tractor}
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.quind.tractorstore: INFO
