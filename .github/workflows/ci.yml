# Pipeline único del monorepo — solo ejecuta backend o frontend según archivos cambiados
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'tractor-store-backend/**'
            frontend:
              - 'tractor-store-frontend/**'
            shared:
              - '.github/**'
              - 'sonar-project.properties'
              - 'docker-compose.yml'
              - '.gitignore'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'DEPLOYMENT.md'

  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tractor-store-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - name: Test & package
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: tractor-store-backend/target/site/jacoco/

  frontend:
    name: Frontend (Nx / pnpm)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tractor-store-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tractor-store-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MSW worker (shell)
        run: pnpm exec msw init apps/shell/public --save

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: tractor-store-frontend/coverage/

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production

  # Envía cobertura (JaCoCo + lcov) al proyecto "Hackaton" en SonarCloud
  sonar-hackaton:
    name: SonarCloud (Hackaton monorepo)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - name: Backend tests & JaCoCo
        working-directory: tractor-store-backend
        run: mvn -B verify

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tractor-store-frontend/pnpm-lock.yaml

      - name: Frontend tests & lcov
        working-directory: tractor-store-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:coverage

      # Jest escribe SF:packages/...; Sonar indexa tractor-store-frontend/packages/... desde la raíz
      - name: Preparar lcov con rutas del monorepo
        run: |
          out=tractor-store-frontend/coverage/lcov.sonar.info
          : > "$out"
          for f in tractor-store-frontend/coverage/packages/*/lcov.info; do
            sed 's|^SF:packages/|SF:tractor-store-frontend/packages/|; s|^SF:apps/|SF:tractor-store-frontend/apps/|' "$f" >> "$out"
          done
          wc -l "$out"
          grep -m1 '^SF:tractor-store-frontend/packages/' "$out"

      - name: Verificar reportes de cobertura
        run: |
          test -f tractor-store-backend/target/site/jacoco/jacoco.xml
          test -s tractor-store-frontend/coverage/lcov.sonar.info

      - name: SonarCloud scan (monorepo Hackaton)
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: .
          args: -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar-backend:
    name: SonarCloud (backend)
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: |
      always() &&
      needs.backend.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: tractor-store-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - run: mvn -B verify

      # La action no hereda working-directory; usar projectBaseDir del backend
      - name: SonarCloud scan (backend)
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: tractor-store-backend
          args: -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  sonar-frontend:
    name: SonarCloud (frontend)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    defaults:
      run:
        working-directory: tractor-store-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tractor-store-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

      # Sin projectBaseDir la action lee sonar-project.properties de la raíz (Java) y falla
      - name: SonarCloud scan (frontend)
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: tractor-store-frontend
          args: -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-backend:
    name: Docker image (backend)
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success'
    defaults:
      run:
        working-directory: tractor-store-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tractor-store-backend/pom.xml

      - run: mvn -B -DskipTests package

      - name: Build image
        run: docker build -t tractor-store-backend:${{ github.sha }} .

  docker-frontend:
    name: Docker image (frontend)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.frontend.result == 'success'
    defaults:
      run:
        working-directory: tractor-store-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tractor-store-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec msw init apps/shell/public --save
      - run: pnpm build
        env:
          NODE_ENV: production

      - name: Build image
        run: docker build -t tractor-store-frontend:${{ github.sha }} .
